{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhiOTWeb</title>
    <base href="/" />
    <link rel="stylesheet" href="{% static 'dist/vendor.css' %}" />
    <style>
      .loader {
        border: 16px solid #f3f3f3;
        border-radius: 50%;
        border-top: 16px solid #00adff8c;
        border-bottom: 16px solid #00adff8c;
        width: 120px;
        height: 120px;
        animation: spin 2s linear infinite;
        position: absolute;
        margin: auto;
        top: 0; right: 0; bottom: 0; left: 0;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #snackbar, #snackbarSuccess {
        visibility: hidden;
        min-width: 250px;
        margin-left: -125px;
        text-align: center;
        color: #fff;
        border-radius: 2px;
        padding: 16px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 30px;
        font-size: 17px;
      }
      #snackbar { background-color: #333; }
      #snackbarSuccess { background-color: #41baf1f8; }
      #snackbar.show, #snackbarSuccess.show {
        visibility: visible;
        animation: fadein 0.5s, fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from { bottom: 0; opacity: 0; }
        to { bottom: 30px; opacity: 1; }
      }
      @keyframes fadeout {
        from { bottom: 30px; opacity: 1; }
        to { bottom: 0; opacity: 0; }
      }
    </style>
</head>
<body>
    <app>
        <div><div class="loader"></div></div>
    </app>
    <script src="{% static 'dist/vendor.js' %}"></script>
    <script src="{% static 'dist/main-client.js' %}"></script>
</body>
</html>
